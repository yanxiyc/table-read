<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Scene</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Create Scene</h1>
      <form id="create-form" class="form-grid">
        <label>
          Scene Title
          <input type="text" name="title" value="kitchen_tense" required />
        </label>

        <label>
          AI Character Name
          <input type="text" name="ai_character_name" value="MOTHER" required />
        </label>

        <label>
          Cartesia Voice ID
          <input type="text" name="ai_voice_id" placeholder="cartesia_voice_123" required />
        </label>

        <label class="full">
          Script
          <textarea name="script_text" rows="12" required>MOTHER: You’re late.
YOU:
MOTHER: Don’t do this here.
YOU:
MOTHER: Fine. Say it.
YOU:</textarea>
        </label>

        <button type="submit">Save Scene</button>
      </form>
      <p id="create-error" class="error" hidden></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("create-form");
    const errorEl = document.getElementById("create-error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.hidden = true;

      const payload = Object.fromEntries(new FormData(form).entries());
      const response = await fetch("/api/scenes", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        errorEl.textContent = err.detail || "Failed to create scene.";
        errorEl.hidden = false;
        return;
      }

      const data = await response.json();
      window.location.assign(`/scene/${data.scene_id}`);
    });
  </script>
</body>
</html>
