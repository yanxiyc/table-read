<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scene Runtime</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container" data-scene-id="{{ scene_id }}">
    <section class="card">
      <header class="row">
        <h1 id="scene-title">Scene</h1>
        <span id="status-badge" class="badge idle">IDLE</span>
      </header>
      <div class="row">
        <button id="start-btn">Start Scene</button>
        <button id="mic-toggle-btn" class="secondary">Enable Mic</button>
        <span id="mic-status">Mic disabled</span>
      </div>
    </section>

    <section class="grid">
      <article class="card">
        <h2>Active Script</h2>
        <ol id="script-panel" class="script-list"></ol>
      </article>

      <article class="card">
        <h2>Transcript</h2>
        <div id="transcript-panel" class="transcript"></div>
      </article>
    </section>

    <section class="card" id="locked-output" hidden>
      <h2>Locked Script</h2>
      <pre id="locked-script-text"></pre>
      <h3>Notes</h3>
      <ul id="locked-notes"></ul>
    </section>

    <audio id="ai-audio-player" autoplay></audio>
  </main>
  <script src="/static/scene.js"></script>
</body>
</html>
