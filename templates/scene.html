<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scene Runtime</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container" data-scene-id="{{ scene_id }}">
    <section class="card">
      <header class="row">
        <h1 id="scene-title">Scene</h1>
        <span id="status-badge" class="badge idle">IDLE</span>
      </header>
      <div class="row">
        <button id="start-btn">Start Scene</button>
        <button id="end-btn">End Scene</button>
        <button id="mic-toggle-btn" class="secondary" disabled>Enable Mic (Agent)</button>
        <span id="mic-status">Mic disabled</span>
      </div>
    </section>

    <section class="card">
      <h2>Active Script</h2>
      <ol id="script-panel" class="script-list"></ol>
    </section>

    <section class="card" id="locked-output" hidden>
      <h2>Updated Script</h2>
      <pre id="locked-script-text"></pre>
    </section>

    <audio id="ai-audio-player" autoplay></audio>
  </main>
  <script src="/static/scene.js"></script>
</body>
</html>
