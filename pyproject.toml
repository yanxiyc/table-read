[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "table-read"
version = "0.1.0"
description = "Director-driven voice rehearsal MVP"
requires-python = ">=3.10"
dependencies = [
  "livekit-agents[cartesia,silero,openai]>=1.0.0",
  "livekit-plugins-anthropic>=1.2.0",
  "livekit-api>=1.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
